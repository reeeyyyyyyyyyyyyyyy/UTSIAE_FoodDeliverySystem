services:
  # MySQL Databases
  user_db:
    image: mysql:8.0
    container_name: user_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: user_db
    ports:
      - "3301:3306"
    networks:
      - iae-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  restaurant_db:
    image: mysql:8.0
    container_name: restaurant_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: restaurant_db
    ports:
      - "3302:3306"
    networks:
      - iae-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  order_db:
    image: mysql:8.0
    container_name: order_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: order_db
    ports:
      - "3303:3306"
    networks:
      - iae-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Node.js Services
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "4001:4001"
    environment:
      DB_HOST: user_db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: user_db
      NODE_ENV: development
    depends_on:
      user_db:
        condition: service_healthy
    networks:
      - iae-network

  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    container_name: restaurant-service
    ports:
      - "4002:4002"
    environment:
      DB_HOST: restaurant_db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: restaurant_db
      NODE_ENV: development
    depends_on:
      restaurant_db:
        condition: service_healthy
    networks:
      - iae-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "4003:4003"
    environment:
      DB_HOST: order_db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: order_db
      USER_SERVICE_URL: http://user-service:4001/graphql
      RESTAURANT_SERVICE_URL: http://restaurant-service:4002/graphql
      NODE_ENV: development
    depends_on:
      order_db:
        condition: service_healthy
    networks:
      - iae-network

networks:
  iae-network:
    driver: bridge
